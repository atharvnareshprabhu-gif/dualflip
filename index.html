<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dualflip: Light & Void</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            flex-direction: column;
        }
        .game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.25);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #1f293d;
        }
        canvas {
            display: block;
            background: #090d16;
            cursor: pointer;
        }
        .instructions {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #9ca3af;
            text-align: center;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
    </div>
    <div class="instructions">
        Tap Screen or Press <b>SPACEBAR</b> to Switch Mode
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Game States
        const STATE_START = "START";
        const STATE_PLAYING = "PLAYING";
        const STATE_GAMEOVER = "GAMEOVER";
        let gameState = STATE_START;

        const MODE_LIGHT = "LIGHT";
        const MODE_DARK = "DARK";

        // Colors
        const LIGHT_COLOR = "#00ffff"; // Neon Cyan
        const DARK_COLOR = "#ff007f";  // Neon Pink

        let player = {
            x: 80,
            y: canvas.height / 2,
            radius: 20,
            mode: MODE_LIGHT,
            pulse: 0
        };

        let obstacles = [];
        let particles = [];
        let stars = [];
        let score = 0;
        let highScore = localStorage.getItem("shadow_switcher_highscore") || 0;
        let gameSpeed = 4;
        let spawnTimer = 0;

        // Milestone notification variables
        let notificationText = "";
        let notificationTimer = 0;
        let reached100 = false;
        let reached200 = false;

        // Play Button Area (for click detection on splash screen)
        const playButton = {
            x: canvas.width / 2 - 80,
            y: canvas.height / 2 + 30,
            width: 160,
            height: 50
        };

        // Initialize Background Stars
        for (let i = 0; i < 60; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speed: Math.random() * 1.5 + 0.5
            });
        }

        // Web Audio Sound System
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            let now = audioCtx.currentTime;

            if (type === 'switch') {
                osc.type = 'sine';
                let freq = (player.mode === MODE_LIGHT) ? 600 : 400;
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(freq + 200, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'milestone') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.25);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        // Event Listeners
        window.addEventListener("keydown", (e) => {
            if (e.code === "Space" || e.code === "ArrowUp") {
                e.preventDefault();
                if (gameState === STATE_START) {
                    startGame();
                } else {
                    handleInput();
                }
            }
        });

        canvas.addEventListener("click", (e) => {
            let rect = canvas.getBoundingClientRect();
            let mouseX = e.clientX - rect.left;
            let mouseY = e.clientY - rect.top;

            if (gameState === STATE_START) {
                // Check if Play button is clicked
                if (
                    mouseX >= playButton.x &&
                    mouseX <= playButton.x + playButton.width &&
                    mouseY >= playButton.y &&
                    mouseY <= playButton.y + playButton.height
                ) {
                    startGame();
                }
            } else {
                handleInput();
            }
        });

        canvas.addEventListener("touchstart", (e) => {
            e.preventDefault();
            let rect = canvas.getBoundingClientRect();
            let touchX = e.touches[0].clientX - rect.left;
            let touchY = e.touches[0].clientY - rect.top;

            if (gameState === STATE_START) {
                if (
                    touchX >= playButton.x &&
                    touchX <= playButton.x + playButton.width &&
                    touchY >= playButton.y &&
                    touchY <= playButton.y + playButton.height
                ) {
                    startGame();
                }
            } else {
                handleInput();
            }
        });

        function startGame() {
            initAudio();
            resetGame();
            gameState = STATE_PLAYING;
        }

        function handleInput() {
            initAudio();
            if (gameState === STATE_GAMEOVER) {
                resetGame();
                gameState = STATE_PLAYING;
            } else if (gameState === STATE_PLAYING) {
                player.mode = (player.mode === MODE_LIGHT) ? MODE_DARK : MODE_LIGHT;
                createBurstParticles(player.x, player.y, (player.mode === MODE_LIGHT) ? LIGHT_COLOR : DARK_COLOR);
                playSound('switch');
            }
        }

        function createBurstParticles(x, y, color) {
            for (let i = 0; i < 12; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 4 + 1;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    alpha: 1
                });
            }
        }

        function spawnObstacle() {
            let mode = Math.random() < 0.5 ? MODE_LIGHT : MODE_DARK;
            obstacles.push({
                x: canvas.width,
                y: player.y - 35,
                width: 35,
                height: 70,
                mode: mode,
                passed: false
            });
        }

        function resetGame() {
            obstacles = [];
            particles = [];
            score = 0;
            gameSpeed = 4;
            spawnTimer = 0;
            player.mode = MODE_LIGHT;
            notificationText = "";
            notificationTimer = 0;
            reached100 = false;
            reached200 = false;
        }

        function update() {
            // Update Stars Background
            stars.forEach(star => {
                star.x -= star.speed * (gameState === STATE_PLAYING ? gameSpeed * 0.5 : 0.5);
                if (star.x < 0) star.x = canvas.width;
            });

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            // Update Notification Timer
            if (notificationTimer > 0) {
                notificationTimer--;
            }

            if (gameState !== STATE_PLAYING) return;

            player.pulse += 0.05;

            // Spawn Obstacles
            spawnTimer++;
            if (spawnTimer > 75) {
                spawnObstacle();
                spawnTimer = 0;
            }

            // Move & Check Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;

                // Collision Detection
                if (
                    player.x + player.radius > obs.x &&
                    player.x - player.radius < obs.x + obs.width &&
                    player.y + player.radius > obs.y &&
                    player.y - player.radius < obs.y + obs.height
                ) {
                    if (player.mode !== obs.mode) {
                        gameState = STATE_GAMEOVER;
                        playSound('hit');
                        createBurstParticles(player.x, player.y, "#ff0055");
                        if (score > highScore) {
                            highScore = score;
                            localStorage.setItem("shadow_switcher_highscore", highScore);
                        }
                    }
                }

                // Score Update
                if (!obs.passed && obs.x + obs.width < player.x - player.radius) {
                    obs.passed = true;
                    score += 10;

                    // Check Milestones
                    if (score === 100 && !reached100) {
                        reached100 = true;
                        notificationText = "GOOD JOB!";
                        notificationTimer = 120;
                        playSound('milestone');
                    } else if (score === 200 && !reached200) {
                        reached200 = true;
                        notificationText = "EXCELLENT!";
                        notificationTimer = 120;
                        playSound('milestone');
                    }

                    if (score % 50 === 0) {
                        gameSpeed += 0.4;
                    }
                }

                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                }
            }
        }

        function drawBackground() {
            let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrad.addColorStop(0, '#05070f');
            bgGrad.addColorStop(1, '#0d1322');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ffffff";
            stars.forEach(star => {
                ctx.globalAlpha = Math.random() * 0.5 + 0.3;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });
            ctx.globalAlpha = 1.0;

            ctx.strokeStyle = "rgba(0, 255, 255, 0.15)";
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(0, player.y);
            ctx.lineTo(canvas.width, player.y);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function draw() {
            drawBackground();

            // Draw Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            // Draw Obstacles
            for (let obs of obstacles) {
                let color = (obs.mode === MODE_LIGHT) ? LIGHT_COLOR : DARK_COLOR;
                ctx.fillStyle = color;
                ctx.shadowColor = color;
                ctx.shadowBlur = 15;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

                ctx.fillStyle = "#ffffff";
                ctx.fillRect(obs.x + 12, obs.y + 5, 10, obs.height - 10);
            }
            ctx.shadowBlur = 0;

            // Draw Player
            if (gameState === STATE_PLAYING) {
                let playerColor = (player.mode === MODE_LIGHT) ? LIGHT_COLOR : DARK_COLOR;
                let glowRadius = player.radius + Math.sin(player.pulse) * 3;

                ctx.beginPath();
                ctx.arc(player.x, player.y, glowRadius, 0, Math.PI * 2);
                ctx.fillStyle = playerColor;
                ctx.shadowColor = playerColor;
                ctx.shadowBlur = 25;
                ctx.fill();
                ctx.closePath();
                ctx.shadowBlur = 0;

                ctx.beginPath();
                ctx.arc(player.x, player.y, player.radius * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = "#ffffff";
                ctx.fill();
                ctx.closePath();
            }

            // Draw Milestone Notification Banner
            if (notificationTimer > 0) {
                ctx.save();
                ctx.font = "bold 28px Arial";
                ctx.textAlign = "center";
                ctx.shadowColor = notificationText === "EXCELLENT!" ? "#ff007f" : "#00ffff";
                ctx.shadowBlur = 20;
                ctx.fillStyle = notificationText === "EXCELLENT!" ? "#ff007f" : "#00ffff";
                ctx.fillText(notificationText, canvas.width / 2, canvas.height / 3);
                ctx.restore();
            }

            // Draw UI Score
            if (gameState === STATE_PLAYING) {
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 18px Arial";
                ctx.textAlign = "left";
                ctx.fillText(`SCORE: ${score}`, 20, 35);

                ctx.fillStyle = "#00ffff";
                ctx.font = "bold 14px Arial";
                ctx.textAlign = "right";
                ctx.fillText(`BEST: ${highScore}`, canvas.width - 20, 35);
            }

            // START SPLASH SCREEN
            if (gameState === STATE_START) {
                ctx.fillStyle = "rgba(5, 7, 15, 0.9)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Game Title
                ctx.shadowColor = "#00ffff";
                ctx.shadowBlur = 20;
                ctx.fillStyle = "#00ffff";
                ctx.font = "bold 26px Arial";
                ctx.textAlign = "center";
                ctx.fillText("dualflip", canvas.width / 2, canvas.height / 2 - 70);
                ctx.shadowBlur = 0;

                ctx.fillStyle = "#ff007f";
                ctx.font = "bold 16px Arial";
                ctx.fillText("LIGHT & VOID", canvas.width / 2, canvas.height / 2 - 40);

                // Play Button Box
                ctx.shadowColor = "#00ffff";
                ctx.shadowBlur = 15;
                ctx.fillStyle = "#00ffff";
                ctx.fillRect(playButton.x, playButton.y, playButton.width, playButton.height);
                ctx.shadowBlur = 0;

                // Play Button Text
                ctx.fillStyle = "#05070f";
                ctx.font = "bold 20px Arial";
                ctx.fillText("PLAY", canvas.width / 2, playButton.y + 32);

                // Best Score on Start Screen
                ctx.fillStyle = "#9ca3af";
                ctx.font = "14px Arial";
                ctx.fillText(`High Score: ${highScore}`, canvas.width / 2, canvas.height / 2 + 115);
            }

            // GAME OVER SCREEN
            if (gameState === STATE_GAMEOVER) {
                ctx.fillStyle = "rgba(5, 7, 15, 0.88)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.shadowColor = "#ff0055";
                ctx.shadowBlur = 20;
                ctx.fillStyle = "#ff0055";
                ctx.font = "bold 32px Arial";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 50);
                ctx.shadowBlur = 0;

                ctx.fillStyle = "#ffffff";
                ctx.font = "18px Arial";
                ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 - 10);

                ctx.fillStyle = "#00ffff";
                ctx.font = "16px Arial";
                ctx.fillText(`Best Score: ${highScore}`, canvas.width / 2, canvas.height / 2 + 18);

                ctx.fillStyle = "#9ca3af";
                ctx.font = "14px Arial";
                ctx.fillText("Tap or Press Space to Restart", canvas.width / 2, canvas.height / 2 + 65);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
